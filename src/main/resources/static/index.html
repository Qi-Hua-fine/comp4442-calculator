<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>COMP4442 Calculator Service</title>
	<style>
		:root {
			--bg: #f6f7f9;
			--panel: #ffffff;
			--text: #1f2937;
			--muted: #64748b;
			--border: #d8dee7;
			--accent: #2563eb;
			--accent-dark: #1d4ed8;
			--success: #047857;
			--error: #b91c1c;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.5;
		}

		main {
			width: min(1080px, calc(100% - 32px));
			margin: 32px auto;
		}

		header {
			margin-bottom: 20px;
		}

		h1 {
			margin: 0 0 4px;
			font-size: 28px;
			font-weight: 700;
		}

		p {
			margin: 0;
			color: var(--muted);
		}

		.layout {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
			gap: 16px;
			align-items: start;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 18px;
		}

		.side-panel {
			display: flex;
			flex-direction: column;
			max-height: 720px;
		}

		.panel h2 {
			margin: 0 0 14px;
			font-size: 18px;
		}

		label {
			display: block;
			margin-bottom: 6px;
			color: #334155;
			font-size: 14px;
			font-weight: 600;
		}

		input {
			width: 100%;
			min-height: 40px;
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 8px 10px;
			color: var(--text);
			font: inherit;
			background: #ffffff;
		}

		input:focus {
			outline: 2px solid rgba(37, 99, 235, 0.18);
			border-color: var(--accent);
		}

		.operation-groups {
			display: grid;
			gap: 14px;
		}

		.operation-group-title {
			margin-bottom: 8px;
			color: var(--muted);
			font-size: 13px;
			font-weight: 700;
			text-transform: uppercase;
		}

		.operation-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 8px;
		}

		.field-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px;
			margin-top: 14px;
		}

		.field-full {
			grid-column: 1 / -1;
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 16px;
		}

		button {
			min-height: 40px;
			border: 1px solid var(--accent);
			border-radius: 6px;
			padding: 8px 14px;
			background: var(--accent);
			color: #ffffff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}

		button.operation-card {
			min-height: 52px;
			border-color: var(--border);
			background: #ffffff;
			color: var(--text);
			font-weight: 700;
			text-align: center;
		}

		button.operation-card.active {
			border-color: var(--accent);
			background: #eff6ff;
			color: var(--accent-dark);
		}

		button.secondary {
			border-color: var(--border);
			background: #ffffff;
			color: var(--text);
		}

		button:hover {
			background: var(--accent-dark);
		}

		button.operation-card:hover {
			background: #eef2f7;
		}

		button.operation-card.active:hover {
			background: #dbeafe;
		}

		button.secondary:hover {
			background: #eef2f7;
		}

		.result {
			min-height: 118px;
			margin-top: 16px;
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 14px;
			background: #fbfcfe;
		}

		.result strong {
			display: block;
			margin-bottom: 8px;
			color: var(--success);
		}

		.result.error strong {
			color: var(--error);
		}

		.data-list {
			display: grid;
			gap: 10px;
		}

		.side-scroll {
			flex: 1;
			min-height: 260px;
			max-height: 560px;
			margin-top: 14px;
			overflow-y: auto;
			padding-right: 4px;
		}

		.record {
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 10px;
			background: #fbfcfe;
		}

		.record-title {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 4px;
			font-weight: 700;
		}

		.record small {
			color: var(--muted);
			white-space: nowrap;
		}

		.meta {
			color: var(--muted);
			font-size: 14px;
			word-break: break-word;
		}

		.stats-grid {
			display: grid;
			gap: 8px;
			margin-top: 12px;
		}

		.stat-row {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid #edf0f5;
			padding-bottom: 8px;
		}

		.stat-row:last-child {
			border-bottom: 0;
			padding-bottom: 0;
		}

		@media (max-width: 820px) {
			main {
				width: min(100% - 20px, 680px);
				margin: 20px auto;
			}

			.layout,
			.field-grid {
				grid-template-columns: 1fr;
			}

			.side-panel {
				max-height: none;
			}

			.side-scroll {
				max-height: 420px;
			}

			.operation-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>COMP4442 Calculator Service</h1>
		</header>

		<div class="layout">
			<section class="panel" aria-labelledby="calculator-title">
				<h2 id="calculator-title">Calculator</h2>

				<div id="operation-buttons" class="operation-groups" aria-label="Choose operation">
					<div>
						<div class="operation-group-title">Basic arithmetic</div>
						<div class="operation-grid">
							<button type="button" class="operation-card active" data-operation="add">Add</button>
							<button type="button" class="operation-card" data-operation="sub">Subtract</button>
							<button type="button" class="operation-card" data-operation="mul">Multiply</button>
							<button type="button" class="operation-card" data-operation="div">Divide</button>
						</div>
					</div>
					<div>
						<div class="operation-group-title">Single-number operations</div>
						<div class="operation-grid">
							<button type="button" class="operation-card" data-operation="square">Square</button>
							<button type="button" class="operation-card" data-operation="sqrt">Square Root</button>
						</div>
					</div>
					<div>
						<div class="operation-group-title">List operations</div>
						<div class="operation-grid">
							<button type="button" class="operation-card" data-operation="sum">Sum</button>
							<button type="button" class="operation-card" data-operation="avg">Average</button>
							<button type="button" class="operation-card" data-operation="min">Min</button>
							<button type="button" class="operation-card" data-operation="max">Max</button>
						</div>
					</div>
					<div>
						<div class="operation-group-title">Special operations</div>
						<div class="operation-grid">
							<button type="button" class="operation-card" data-operation="pow">Power</button>
							<button type="button" class="operation-card" data-operation="percent">Percent</button>
						</div>
					</div>
				</div>

				<form id="calculator-form">
					<div id="input-fields" class="field-grid"></div>
					<div class="actions">
						<button type="submit">Calculate</button>
					</div>
				</form>

				<div id="result" class="result" aria-live="polite">
					<strong>Ready</strong>
					<div class="meta">Choose an operation and submit values.</div>
				</div>
			</section>

			<aside class="panel side-panel" aria-labelledby="history-title">
				<h2 id="history-title">History</h2>
				<div class="actions">
					<button type="button" class="secondary" id="load-history">Load History</button>
					<button type="button" class="secondary" id="load-stats">Load Stats</button>
				</div>
				<div class="side-scroll">
					<div id="history-list" class="data-list"></div>
					<div id="stats-panel" class="stats-grid"></div>
				</div>
			</aside>
		</div>
	</main>

	<script>
		const operationButtons = document.getElementById('operation-buttons');
		const form = document.getElementById('calculator-form');
		const inputFields = document.getElementById('input-fields');
		const resultBox = document.getElementById('result');
		const historyList = document.getElementById('history-list');
		const statsPanel = document.getElementById('stats-panel');
		let selectedOperation = 'add';

		const operationConfig = {
			add: { endpoint: '/add', fields: ['a', 'b'] },
			sub: { endpoint: '/sub', fields: ['a', 'b'] },
			mul: { endpoint: '/mul', fields: ['a', 'b'] },
			div: { endpoint: '/div', fields: ['a', 'b'] },
			square: { endpoint: '/square', fields: ['a'] },
			sum: { endpoint: '/sum', list: true },
			max: { endpoint: '/max', list: true },
			pow: { endpoint: '/pow', fields: ['a', 'b'] },
			sqrt: { endpoint: '/sqrt', fields: ['a'] },
			avg: { endpoint: '/avg', list: true },
			min: { endpoint: '/min', list: true },
			percent: { endpoint: '/percent', fields: ['value', 'total'] }
		};

		function titleCase(value) {
			return value.replace(/(^|[-_ ])\w/g, letter => letter.toUpperCase());
		}

		function renderInputs() {
			const config = operationConfig[selectedOperation];
			inputFields.innerHTML = '';

			if (config.list) {
				inputFields.appendChild(createInput('numbers', 'Numbers', true));
				return;
			}

			for (const field of config.fields) {
				inputFields.appendChild(createInput(field, titleCase(field), false));
			}
		}

		function createInput(name, labelText, fullWidth) {
			const wrapper = document.createElement('div');
			if (fullWidth) wrapper.className = 'field-full';

			const label = document.createElement('label');
			label.htmlFor = `field-${name}`;
			label.textContent = labelText;

			const input = document.createElement('input');
			input.id = `field-${name}`;
			input.name = name;
			input.placeholder = 'Input number here...';
			input.type = 'text';
			input.inputMode = 'decimal';

			wrapper.append(label, input);
			return wrapper;
		}

		function buildQuery(config) {
			const params = new URLSearchParams();

			if (config.list) {
				const raw = form.elements.numbers.value.trim();
				if (raw.length === 0) return params;

				raw.split(/[\s,]+/)
					.filter(Boolean)
					.forEach(value => params.append('numbers', value));
				return params;
			}

			for (const field of config.fields) {
				const value = form.elements[field].value.trim();
				if (value !== '') params.append(field, value);
			}

			return params;
		}

		function setResult(response) {
			const isError = response.message && response.message.startsWith('Error:');
			resultBox.classList.toggle('error', isError);
			resultBox.innerHTML = `
				<strong>${escapeHtml(response.message || 'No message')}</strong>
				<div class="meta">Operation: ${escapeHtml(response.operation || '')}</div>
				<div class="meta">Input: ${escapeHtml(response.input || '')}</div>
				<div class="meta">Result: ${escapeHtml(formatValue(response.result))}</div>
			`;
		}

		function renderHistory(records) {
			historyList.innerHTML = '';
			statsPanel.innerHTML = '';

			if (!records.length) {
				historyList.innerHTML = '<div class="meta">No saved calculations.</div>';
				return;
			}

			for (const record of records.slice().reverse()) {
				historyList.appendChild(recordElement(record));
			}
		}

		function renderStats(stats) {
			historyList.innerHTML = '';
			const counts = stats.countByOperation || {};
			const rows = Object.entries(counts)
				.map(([operation, count]) => `
					<div class="stat-row">
						<span>${escapeHtml(operation)}</span>
						<strong>${count}</strong>
					</div>
				`)
				.join('');

			statsPanel.innerHTML = `
				<div class="stat-row">
					<span>Total calculations</span>
					<strong>${stats.totalCalculations}</strong>
				</div>
				${rows || '<div class="meta">No operation counts yet.</div>'}
				<div class="record">
					<div class="record-title">
						<span>Latest</span>
					</div>
					${stats.latestCalculation ? recordDetails(stats.latestCalculation) : '<div class="meta">No latest calculation.</div>'}
				</div>
			`;
		}

		function recordElement(record) {
			const element = document.createElement('div');
			element.className = 'record';
			element.innerHTML = `
				<div class="record-title">
					<span>${escapeHtml(record.operation)}</span>
					<small>${escapeHtml(record.timestamp)}</small>
				</div>
				${recordDetails(record)}
			`;
			return element;
		}

		function recordDetails(record) {
			return `
				<div class="meta">Input: ${escapeHtml(record.input)}</div>
				<div class="meta">Result: ${escapeHtml(formatValue(record.result))}</div>
			`;
		}

		function formatValue(value) {
			if (value === null || value === undefined) return '';
			if (typeof value === 'object') return JSON.stringify(value);
			return String(value);
		}

		function escapeHtml(value) {
			return String(value)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#039;');
		}

		async function getJson(url) {
			const response = await fetch(url);
			if (!response.ok) throw new Error(`Request failed: ${response.status}`);
			return response.json();
		}

		function selectOperation(operation) {
			selectedOperation = operation;

			for (const button of operationButtons.querySelectorAll('.operation-card')) {
				button.classList.toggle('active', button.dataset.operation === operation);
			}

			renderInputs();
		}

		form.addEventListener('submit', async event => {
			event.preventDefault();

			const config = operationConfig[selectedOperation];
			const params = buildQuery(config);
			const url = params.toString() ? `${config.endpoint}?${params}` : config.endpoint;

			try {
				setResult(await getJson(url));
			} catch (error) {
				setResult({ operation: selectedOperation, input: '', result: null, message: `Error: ${error.message}` });
			}
		});

		operationButtons.addEventListener('click', event => {
			const button = event.target.closest('.operation-card');
			if (!button) return;
			selectOperation(button.dataset.operation);
		});

		document.getElementById('load-history').addEventListener('click', async () => {
			try {
				renderHistory(await getJson('/history'));
			} catch (error) {
				historyList.innerHTML = `<div class="meta">Error: ${escapeHtml(error.message)}</div>`;
			}
		});

		document.getElementById('load-stats').addEventListener('click', async () => {
			try {
				renderStats(await getJson('/stats'));
			} catch (error) {
				statsPanel.innerHTML = `<div class="meta">Error: ${escapeHtml(error.message)}</div>`;
			}
		});

		renderInputs();
	</script>
</body>
</html>
